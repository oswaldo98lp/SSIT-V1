{% extends "base.html" %}

{% block title %}Cerrar Sesión - {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-4 py-md-5">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="ssit-card p-4 p-md-5 text-center">
            <div class="d-inline-flex p-3 bg-warning-subtle text-warning rounded-circle mb-3">
                <i class="bi bi-box-arrow-right fs-1"></i>
            </div>
            <h2 class="h4 fw-bold mb-2">¿Deseas cerrar sesión?</h2>
            <p class="text-muted small mb-4">Se finalizará tu sesión activa en este dispositivo.</p>

            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
                    </button>
                    <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
